name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONAN_VERSION: "2.1.0"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: format/lint are advisory (do not block merge yet)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (advisory)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting (advisory)
        run: |
          set +e
          files=$(git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' | head -n 200)
          bad=0
          for f in $files; do
            clang-format --dry-run --Werror "$f" 2>/dev/null || bad=$((bad+1))
          done
          echo "Files needing format: $bad (advisory)"
          exit 0

  # ---------------------------------------------------------------------------
  # Parallel multi-compiler builds + tests
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
            build_type: Debug
            coverage: true
          - compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
            build_type: Release
            coverage: false
          - compiler: clang-15
            cc: clang-15
            cxx: clang++-15
            build_type: Release
            coverage: false

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          # Do not install system libprotobuf-dev/protobuf-compiler: Conan provides
          # protobuf/3.21 and mixing system protoc with Conan headers breaks codegen.
          pkgs="build-essential cmake ninja-build pkg-config python3-pip python3-setuptools python3-wheel libssl-dev libsecp256k1-dev libsodium-dev librocksdb-dev"
          case "${{ matrix.compiler }}" in
            gcc-*) pkgs="$pkgs ${{ matrix.compiler }}" ;;
            clang-*) pkgs="$pkgs ${{ matrix.compiler }} ${{ matrix.cxx }}" ;;
          esac
          if [ "${{ matrix.coverage }}" = "true" ]; then
            pkgs="$pkgs lcov"
          fi
          sudo apt-get install -y $pkgs

      - name: Setup Python / Conan
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.compiler }}-
            conan-${{ runner.os }}-

      - name: Conan install
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=${{ matrix.build_type }}

      - name: Configure & build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON \
            -DTREAT_WARNINGS_AS_ERRORS=OFF \
            ${{ matrix.coverage && '-DENABLE_COVERAGE=ON' || '' }}
          cmake --build build --parallel

      - name: Verify node binary
        run: |
          test -x build/bin/tokiwa-node
          ./build/bin/tokiwa-node --self-check
          ./build/bin/tokiwa-node --help | grep -qi tokiwa

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure --parallel "$(nproc)" || {
            # If no tests were registered, do not fail the job when BUILD_TESTING
            # produced zero test cases (skeleton phase). Fail only on real failures.
            count=$(ctest -N | tail -n 1 | grep -oE '[0-9]+' | head -n 1 || echo 0)
            if [ "${count:-0}" -eq 0 ]; then
              echo "No tests registered; continuing"
              exit 0
            fi
            exit 1
          }

      - name: Coverage (Debug/GCC only)
        if: matrix.coverage
        run: |
          lcov --capture --directory build --output-file coverage.info || true
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/.conan2/*' --output-file coverage.info || true
          lcov --list coverage.info || true

      - name: Upload binaries
        if: matrix.build_type == 'Release' && matrix.compiler == 'gcc-12'
        uses: actions/upload-artifact@v4
        with:
          name: tokiwa-linux-amd64
          path: |
            build/bin/tokiwa-node
            build/bin/tokiwa-core-test
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Sanitizers (ASan+UBSan) — parallel to matrix, not after a long chain
  # ---------------------------------------------------------------------------
  sanitize:
    name: Sanitizers (ASan+UBSan)
    runs-on: ubuntu-22.04
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            python3-pip libssl-dev libsecp256k1-dev libsodium-dev \
            librocksdb-dev g++-12

      - name: Setup Conan
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-asan-${{ hashFiles('conanfile.txt') }}
          restore-keys: conan-asan-

      - name: Build with sanitizers
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          conan install . --output-folder=build --build=missing -s build_type=Debug
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
            -DBUILD_TESTING=ON \
            -DUSE_SANITIZERS=OFF \
            -DTREAT_WARNINGS_AS_ERRORS=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build --parallel
          ./build/bin/tokiwa-node --self-check
          cd build && ctest --output-on-failure --parallel "$(nproc)" || true

  # ---------------------------------------------------------------------------
  # Docker: infra compose + node image build (cached)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker
    runs-on: ubuntu-22.04
    needs: [build]
    if: always() && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start infra services
        run: |
          docker compose up -d postgres redis prometheus grafana jaeger
          for i in $(seq 1 30); do
            docker compose ps
            docker compose exec -T postgres pg_isready -U tokiwa && break
            sleep 2
          done
          docker compose exec -T postgres pg_isready -U tokiwa

      - name: Build node image
        run: |
          docker build -f deploy/docker/Dockerfile.node \
            --target runtime \
            -t tokiwa/tokiwa-node:ci \
            .

      - name: Smoke node image
        run: |
          docker run --rm tokiwa/tokiwa-node:ci --self-check
          docker run --rm tokiwa/tokiwa-node:ci --help

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # SBOM from uploaded Release artifact
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM
    runs-on: ubuntu-22.04
    needs: [build]
    if: always() && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: tokiwa-linux-amd64
          path: artifacts

      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          syft dir:artifacts -o spdx-json > sbom.spdx.json
          syft dir:artifacts -o json > sbom.json
          test -s sbom.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.json
            sbom.spdx.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Required gate — single status check for branch protection
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI Success
    runs-on: ubuntu-22.04
    needs: [build, sanitize, docker, sbom]
    if: always()
    steps:
      - name: Evaluate
        run: |
          echo "build=${{ needs.build.result }}"
          echo "sanitize=${{ needs.sanitize.result }}"
          echo "docker=${{ needs.docker.result }}"
          echo "sbom=${{ needs.sbom.result }}"
          # Required: build matrix must pass. Sanitize/docker/sbom should pass when not skipped.
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build matrix failed"
            exit 1
          fi
          if [ "${{ needs.sanitize.result }}" != "success" ]; then
            echo "Sanitizer job failed"
            exit 1
          fi
          if [ "${{ needs.docker.result }}" != "success" ]; then
            echo "Docker job failed"
            exit 1
          fi
          if [ "${{ needs.sbom.result }}" != "success" ]; then
            echo "SBOM job failed"
            exit 1
          fi
          echo "All required CI jobs passed"
